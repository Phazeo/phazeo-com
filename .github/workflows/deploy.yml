# Deploy on push to main: build here, upload only. Static files, no Worker script.
# The build job runs the same checks as the build-and-test job of ci.yml on the same commit and holds no
# secret; the deploy job needs it, so a failed check stops the deploy.
# The deploy job runs in the "production" environment and gets the two secrets only in its last step.
#
# Settings of the "production" environment (the owner sets them in GitHub):
# - secret CLOUDFLARE_API_TOKEN: a deploy token limited to this site.
# - secret CLOUDFLARE_ACCOUNT_ID: the account id (a secret so logs mask it).
# - deployment branches: main only.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-headers.mjs
      - run: node --test scripts/check-contributors.test.mjs
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm build
      - name: Check the build has a 404 page
        run: test -f dist/404.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Check the secrets are set
        env:
          # Booleans only: the values never reach this step.
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ] || [ "$ACCOUNT_SET" != "true" ]; then
            echo "The production environment needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      # Wrangler comes from the committed lockfile (7-day cooldown), with install scripts blocked.
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
