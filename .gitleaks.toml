title = "phazeo-com leak guard"

[extend]
useDefault = true

[[allowlists]]
description = "Dependency trees, build output and the lockfile"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.astro/''',
  '''pnpm-lock\.yaml$''',
]

# --- Network identifiers: IPv4, IPv6 and internal hostnames ---
# One rule. Loopback, unspecified and documentation ranges (RFC 5737, RFC 3849) are allowed.
# SVG files (path data looks like numbers) and the lockfile are skipped.
[[rules]]
id = "phazeo-network-identifier"
description = "IPv4/IPv6 address or a hostname ending in .internal, .local or .lan"
regex = '''(?i)(?:\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d?\d)\b|\b(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}\b|(?:\b[0-9a-f]{0,4}:){1,7}:[0-9a-f]{0,4}\b|:(?::[0-9a-f]{1,4}){1,7}\b|\b(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:internal|local|lan)\b)'''

[[rules.allowlists]]
paths = [
  '''\.svg$''',
  '''pnpm-lock\.yaml$''',
]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''^0\.0\.0\.0$''',
  '''^127\.(?:\d{1,3}\.){2}\d{1,3}$''',
  '''^192\.0\.2\.\d{1,3}$''',
  '''^198\.51\.100\.\d{1,3}$''',
  '''^203\.0\.113\.\d{1,3}$''',
  '''(?i)^::1?$''',
  '''(?i)^2001:db8:''',
]

# --- Connection strings ---
[[rules]]
id = "phazeo-connection-string"
description = "Database/message-broker connection string with credentials or host"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|redis|mongodb(?:\+srv)?|amqp|amqps):\/\/[^\s"'`]+'''

# --- Literal credential assignments ---
[[rules]]
id = "phazeo-credential-assignment"
description = "password/passwd/secret/token/api_key assigned a quoted literal"
regex = '''(?i)(?:password|passwd|secret|token|api[_-]?key)\s*[=:]\s*['"][^'"]{8,}['"]'''

# --- Authorization headers ---
[[rules]]
id = "phazeo-authorization-header"
description = "Authorization header with a bearer/basic literal"
regex = '''(?i)(?:authorization)\s*[=:]\s*['"]?(?:bearer|basic)\s+[A-Za-z0-9+/=._-]{8,}'''

# --- Private key blocks ---
[[rules]]
id = "phazeo-private-key-block"
description = "PEM private key block"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''

# --- Phone numbers (personal data). ---
# International: + then 8-15 digits with optional spaces/dots/dashes/brackets.
[[rules]]
id = "phazeo-phone-intl"
description = "International phone number (+ then 8-15 digits with optional separators)"
regex = '''\+(?:[\s().-]*\d){8,15}\b'''

# Grouped local-style numbers: (xxx) xxx-xxxx or xxx-xxx-xxxx.
# Avoids SVG path decimals (12.34) and year ranges (2015-2019).
[[rules]]
id = "phazeo-phone-grouped"
description = "Phone-like digit grouping with separators (10+ digits)"
regex = '''(?:\(\d{2,4}\)[\s-]*\d{2,4}[\s-]+\d{2,4}(?:[\s-]+\d{2,4})?|\b\d{3}-\d{3}-\d{4}\b)'''

# Indian mobile: digit boundaries; 10 digits starting 6-9; optional +91 / 91 / 0; optional 5-5 or 3-3-4 split.
[[rules]]
id = "phazeo-phone-in-mobile"
description = "Indian mobile number (10 digits starting 6-9, optional +91/91/0 and 5-5 or 3-3-4 split)"
regex = '''(?:^|\D)(?:\+91[\s.-]?|91[\s.-]?|0)?(?:[6-9]\d{9}|[6-9]\d{4}[\s.-]\d{5}|[6-9]\d{2}[\s.-]\d{3}[\s.-]\d{4})(?:\D|$)'''

# A full commit SHA in a "uses: owner/repo@<sha>" line (an action pin) can contain a digit run
# that looks like a phone number. Only that exact line shape is skipped, in no path-specific way.
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''^\s*(?:-\s*)?uses:\s*\S+@[0-9a-f]{40}(?:\s+#.*)?$''']

# Indian landline: digit boundaries; 0 + 2-4 digit area code + space/dash + 6-8 subscriber digits.
[[rules]]
id = "phazeo-phone-in-landline"
description = "Indian landline (0 + area code + separator + 6-8 digits)"
regex = '''(?:^|\D)0\d{2,4}[\s-]\d{6,8}(?:\D|$)'''